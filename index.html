<!doctype html>

<html lang="it">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">

<meta name="description" content="Mob Wars 3D: gioco arcade 3D ispirato a Mob Control">

<title>Mob Wars 3D</title>

<style>

html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}

canvas{display:block}

#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:none;align-items:center;gap:10px;color:#fff;font-weight:700;text-shadow:0 1px 3px #0008;pointer-events:none}

#hud button{pointer-events:auto;min-width:0;padding:6px 12px}

#bar{flex:1;height:14px;background:#0005;border-radius:7px;overflow:hidden}

#hp{display:block;height:100%;width:100%;background:#ff4d4d}

#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;background:#0b1a3a99;color:#fff;text-align:center;padding:20px;overflow:auto}

button{font:700 17px system-ui;padding:12px 20px;border:0;border-radius:12px;background:#ffb703;color:#222;min-width:200px}

button:disabled{opacity:.4}

.r{display:flex;gap:8px;align-items:center;justify-content:space-between;width:min(360px,90vw);background:#fff2;padding:8px 12px;border-radius:12px;text-align:left}

.r button{min-width:0;padding:8px 12px}

.g{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

.g button{min-width:0;width:56px;padding:12px 0}

h1{margin:0}

</style>

</head>

<body>

<div id="hud"><b id="h1"></b><b id="h2"></b><div id="bar"><i id="hp"></i></div><b id="h3"></b><b id="h4"></b><button onclick="menu()">☰</button></div>

<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const T=THREE,$=id=>document.getElementById(id);

const MAXL=10,MAXP=700,MAXE=300,ZS=18,W=10;

const SK=[["Blu",0x3b82f6,0],["Verde",0x22c55e,80],["Oro",0xf59e0b,200],["Rosa",0xec4899,350],["Viola",0xa855f7,500]];

const UP=[["r","Rinforzi iniziali","+1 soldato iniziale"],["s","Velocità di avanzata","+5% velocità truppe"],["p","Forza unità","+40% vita e danno"],["c","Bonus monete","+20% monete"]];

let S={coins:0,lv:1,up:{r:0,s:0,p:0,c:0},skin:0,own:[1,0,0,0,0]};

try{const d=JSON.parse(localStorage.getItem("mw3d"));if(d)S=Object.assign(S,d)}catch(e){}

const save=()=>{try{localStorage.setItem("mw3d",JSON.stringify(S))}catch(e){}};

const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.appendChild(R.domElement);

const sc=new T.Scene();sc.background=new T.Color(0x8fd3ff);sc.fog=new T.Fog(0x8fd3ff,45,120);

const cam=new T.PerspectiveCamera(55,1,.1,200);

sc.add(new T.HemisphereLight(0xffffff,0x6b8e5a,.95));

const dl=new T.DirectionalLight(0xffffff,.6);dl.position.set(5,12,6);sc.add(dl);

function rsz(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}

addEventListener("resize",rsz);rsz();

const mt=c=>new T.MeshLambertMaterial({color:c});

function mg(a,b){

 const g=new T.BufferGeometry();

 for(const k of["position","normal","uv"]){const x=a.attributes[k].array,y=b.attributes[k].array,z=new Float32Array(x.length+y.length);z.set(x);z.set(y,x.length);g.setAttribute(k,new T.BufferAttribute(z,a.attributes[k].itemSize))}

 const ia=a.index.array,ib=b.index.array,na=a.attributes.position.count,ix=new Uint16Array(ia.length+ib.length);

 ix.set(ia);for(let i=0;i<ib.length;i++)ix[ia.length+i]=ib[i]+na;

 g.setIndex(new T.BufferAttribute(ix,1));return g}

const cg=mg(new T.BoxGeometry(.5,.6,.32).translate(0,.5,0),new T.SphereGeometry(.22,8,6).translate(0,1,0));

const pm=new T.InstancedMesh(cg,mt(SK[S.skin][1]),MAXP),em=new T.InstancedMesh(cg,mt(0xe03131),MAXE);

pm.frustumCulled=em.frustumCulled=false;sc.add(pm,em);

const D=new T.Object3D();

function draw(m,arr,t){

 let i=0;

 for(const u of arr){const w=Math.sin(t*12+u.ph);D.position.set(u.x,Math.abs(w)*.15,u.z);D.rotation.set(0,0,w*.15);D.updateMatrix();m.setMatrixAt(i++,D.matrix)}

 m.count=arr.length;m.instanceMatrix.needsUpdate=true}

const PN=400,pd=[],pa=new Float32Array(PN*3),pc=new Float32Array(PN*3),cc=new T.Color();

for(let i=0;i<PN;i++)pd.push({l:0,x:0,y:0,z:0,vx:0,vy:0,vz:0});

const pg=new T.BufferGeometry();pg.setAttribute("position",new T.BufferAttribute(pa,3));pg.setAttribute("color",new T.BufferAttribute(pc,3));

const pts=new T.Points(pg,new T.PointsMaterial({size:.45,vertexColors:true}));pts.frustumCulled=false;sc.add(pts);

let pi=0;

function boom(x,y,z,col,k){

 cc.setHex(col);

 for(let j=0;j<k;j++){pi=(pi+1)%PN;const p=pd[pi];p.l=.7;p.x=x;p.y=y;p.z=z;p.vx=(Math.random()-.5)*7;p.vy=Math.random()*6;p.vz=(Math.random()-.5)*7;pc[pi*3]=cc.r;pc[pi*3+1]=cc.g;pc[pi*3+2]=cc.b}

 pg.attributes.color.needsUpdate=true}

let st="menu",n=1,P=[],E=[],G=[],O=[],tw=null,wg=new T.Group();

let base=10,et=0,sx=0,tx=0,gain=0,hitT=0,intro=0,eh=2,eiv=3,eb=1;

sc.add(wg);

const hpU=()=>1+.4*S.up.p,dmg=()=>1+.4*S.up.p;

const mb=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

function lab(t,col){const c=document.createElement("canvas");c.width=256;c.height=128;const x=c.getContext("2d");x.fillStyle=col;x.fillRect(0,0,256,128);x.fillStyle="#fff";x.font="bold 84px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText(t,128,68);return new T.CanvasTexture(c)}

const GC={"m2":"#2f80ff","m3":"#7a3cff","m5":"#ff3c8e","a10":"#17a34a","a25":"#f59e0b"};

const POOL=[["m",2],["m",2],["m",3],["a",10],["m",3],["a",25],["m",5]];

function addG(x0,x1,z,t){

 const key=t[0]+t[1],m=new T.Mesh(new T.PlaneGeometry(x1-x0-.4,1.9),new T.MeshBasicMaterial({map:lab(t[0]==="m"?"x"+t[1]:"+"+t[1],GC[key]),transparent:true,opacity:.88,side:T.DoubleSide}));

 m.position.set((x0+x1)/2,1.2,z);wg.add(m);

 const f=new T.Mesh(new T.PlaneGeometry(x1-x0-.4,.8),new T.MeshBasicMaterial({color:new T.Color(GC[key]),transparent:true,opacity:.35}));

 f.rotation.x=-Math.PI/2;f.position.set((x0+x1)/2,.05,z);wg.add(f);

 G.push({x0,x1,z,t:t[0],v:t[1],cd:0,f:0,m})}

function build(k){

 n=k;sc.remove(wg);wg=new T.Group();sc.add(wg);

 const rnd=mb(k*7919+13),len=64+k*6,pick=()=>POOL[Math.floor(rnd()*POOL.length)];

 G=[];O=[];P=[];E=[];gain=0;et=0;base=10;hitT=0;intro=0;sx=tx=0;

 eh=1.5+.2*k;eiv=Math.max(.9,3.2-.2*k);eb=1+(k>4)+(k>8);

 const gr=new T.Mesh(new T.PlaneGeometry(220,len+140),mt(0x62c46a));gr.rotation.x=-Math.PI/2;gr.position.z=-len/2+10;wg.add(gr);

 const ln=new T.Mesh(new T.PlaneGeometry(W+1,len+40),mt(0xd9c7a0));ln.rotation.x=-Math.PI/2;ln.position.set(0,.02,-len/2+8);wg.add(ln);

 for(let i=0;i<46;i++){const tr=new T.Mesh(new T.ConeGeometry(1+rnd(),3+rnd()*2,6),mt([0x2e9e5b,0xe67e22,0x9b59b6,0xe84393][i%4]));tr.position.set((rnd()<.5?-1:1)*(8+rnd()*12),1.5,10-rnd()*(len+20));wg.add(tr)}

 for(let i=0;i<5+S.up.r;i++)addP((i-(4+S.up.r)/2)*.72,ZS+(i%2)*.45);

 const tm=new T.Group(),t1=new T.Mesh(new T.CylinderGeometry(2.4,2.8,5,14),mt(0xc0392b)),t2=new T.Mesh(new T.ConeGeometry(3,2.2,14),mt(0x7d2318));

 t1.position.y=2.5;t2.position.y=6.1;tm.add(t1,t2);tm.position.z=-len;wg.add(tm);

 tw={z:-len,hp:40+30*k,mx:40+30*k,m:tm};

 let first=1;

 for(let z=-8;z>-len+14;z-=10){

  if(first||rnd()>.2+.04*k){first=0;addG(-W/2,0,z,pick());addG(0,W/2,z,pick())}

  else{

   const x=(rnd()-.5)*7;

   if(rnd()<.5){

    const m=new T.Group(),a=new T.Mesh(new T.BoxGeometry(4.4,.4,.5),mt(0xff3b3b)),p=new T.Mesh(new T.CylinderGeometry(.3,.3,.9,8),mt(0x333333));

    a.position.y=.6;p.position.y=.45;m.add(a,p);m.position.set(x,0,z);wg.add(m);O.push({k:"b",x,z,a:rnd()*6,m})

   }else{

    const hp=6+2*k,m=new T.Mesh(new T.BoxGeometry(3.2,1.4,1.1),mt(0xb07a3a));m.position.set(x,.7,z);wg.add(m);O.push({k:"w",x,z,hp,mx:hp,m})}}}

 if(st!=="play")intro=0;

 cp.set(0,12,ZS+13);lk.set(0,0,ZS-7)}

function addP(x,z){if(P.length>=MAXP)return;P.push({x,z,pz:z,h:hpU(),ph:Math.random()*6})}

function hit(g,u){

 if(g.t==="m"){for(let i=1;i<g.v;i++)addP(u.x+(Math.random()-.5)*.8,g.z-.3-Math.random()*.5)}

 else if(g.cd<=0){for(let i=0;i<g.v;i++)addP(u.x+(Math.random()-.5)*1.6,g.z-.3-Math.random()*.8);g.cd=1.5}

 g.f=.25}

function step(dt){

 et+=dt;

 if(et>=eiv&&E.length<MAXE-3){et=0;for(let i=0;i<eb;i++)E.push({x:(Math.random()-.5)*7,z:tw.z+3,h:eh,ph:Math.random()*6})}

 for(const g of G){g.cd-=dt;g.f=Math.max(0,g.f-dt);g.m.scale.setScalar(1+g.f*1.2)}

 for(const o of O)if(o.k==="b"){o.a+=dt*2.2;o.m.rotation.y=o.a}

 const bl=(o,x,z)=>{const dx=x-o.x,dz=z-o.z,c=Math.cos(o.a),s=Math.sin(o.a);return Math.abs(dz)<3&&Math.abs(dx*c-dz*s)<2.2&&Math.abs(dx*s+dz*c)<.45};

 for(const u of P){

  u.pz=u.z;let b=null,bd=16;

  for(const e of E){const dz=e.z-u.z;if(dz>4||dz<-4)continue;const dx=e.x-u.x,d=dx*dx+dz*dz;if(d<bd){bd=d;b=e}}

  let vx=0;

  if(b){vx=Math.sign(b.x-u.x)*3;if(bd<.5){b.h-=dmg()*dt*3;u.h-=dt*3}}

  else if(u.z<tw.z+25)vx=Math.sign(-u.x)*2;

  u.x=Math.max(-W/2,Math.min(W/2,u.x+vx*dt));u.z-=(6*(1+.05*S.up.s))*dt;

  if(u.z<=tw.z+2.3&&Math.abs(u.x)<3.2){tw.hp-=dmg();u.h=0;hitT=.15;boom(u.x,1,u.z,0xffd34d,4)}

  else if(u.z<tw.z-1)u.h=0;

  for(const g of G)if(u.pz>g.z&&u.z<=g.z&&u.x>=g.x0&&u.x<=g.x1)hit(g,u);

  for(const o of O){

   if(o.k==="b"){if(bl(o,u.x,u.z)){u.h=0;boom(u.x,.5,u.z,0xff5555,3)}}

   else if(o.hp>0&&Math.abs(u.x-o.x)<1.7&&Math.abs(u.z-o.z)<.7){

    u.h=0;o.hp--;boom(u.x,.8,u.z,0xb07a3a,3);o.m.scale.y=.3+.7*o.hp/o.mx;

    if(o.hp<=0){o.m.visible=false;boom(o.x,1,o.z,0xb07a3a,28);gain+=4+n}}}

 }

 for(const e of E){

  let b=null,bd=16;

  for(const u of P){const dz=u.z-e.z;if(dz>4||dz<-4)continue;const dx=u.x-e.x,d=dx*dx+dz*dz;if(d<bd){bd=d;b=u}}

  e.x+=(b?Math.sign(b.x-e.x)*2.5:0)*dt;e.z+=3.2*dt;

  for(const o of O)if(o.k==="b"&&bl(o,e.x,e.z))e.h=0;

  if(e.z>=ZS+1){base--;e.h=0;boom(e.x,1,e.z,0x4488ff,8)}

 }

 P=P.filter(u=>{if(u.h>0)return true;boom(u.x,.6,u.z,SK[S.skin][1],3);return false});

 E=E.filter(e=>{if(e.h>0)return true;boom(e.x,.6,e.z,0xff4444,5);gain+=.25;return false});

 hitT=Math.max(0,hitT-dt);tw.m.scale.setScalar(1+hitT*2);

 if(tw.hp<=0){st="won";tw.m.visible=false;for(let i=0;i<6;i++)boom((Math.random()-.5)*4,2+Math.random()*3,tw.z,[0xff6b35,0xffd34d,0xc0392b][i%3],40);setTimeout(()=>end(true),1300)}

 else if(base<=0||P.length===0){st="lost";setTimeout(()=>end(false),900)}

}

function end(w){

 const g=Math.round((gain+(w?25+10*n:5))*(1+.2*S.up.c));S.coins+=g;

 if(w)S.lv=Math.max(S.lv,Math.min(MAXL,n+1));save();$("hud").style.display="none";

 panel("<h1>"+(w?"Vittoria!":"Sconfitta")+"</h1><p>+"+g+" 🪙</p>"+(w&&n<MAXL?'<button onclick="play('+(n+1)+')">Livello successivo</button>':"")+(w&&n>=MAXL?"<p>Hai completato tutti i livelli!</p>":"")+'<button onclick="play('+n+')">Riprova</button><button onclick="menu()">Menu</button>')}

function panel(h){$("ui").innerHTML=h;$("ui").style.display=h?"flex":"none"}

function menu(){build(S.lv);st="menu";$("hud").style.display="none";

 panel('<h1>Mob Wars 3D</h1><p>🪙 '+S.coins+'</p><button onclick="play(S.lv)">▶ Gioca livello '+S.lv+'</button><button onclick="lvls()">Livelli</button><button onclick="ups()">Potenziamenti</button><button onclick="skins()">Skin</button><p style="max-width:300px">Inizia con 5 soldati. Trascina a destra e sinistra per guidare l&#39;esercito, attraversa i cancelli per aumentare le truppe e conquista la torre nemica.</p>')}

function play(k){st="play";build(k);panel("");$("hud").style.display="flex"}

function lvls(){panel("<h1>Livelli</h1><div class=g>"+Array.from({length:MAXL},(_,i)=>"<button "+(i+1>S.lv?"disabled":"")+' onclick="play('+(i+1)+')">'+(i+1)+"</button>").join("")+'</div><button onclick="menu()">Indietro</button>')}

const cost=l=>Math.round(40*Math.pow(1.6,l));

function ups(){panel("<h1>Potenziamenti</h1><p>🪙 "+S.coins+"</p>"+UP.map(u=>{const l=S.up[u[0]];return'<div class=r><span><b>'+u[1]+" ("+l+"/10)</b><br>"+u[2]+'</span><button '+(l>=10||S.coins<cost(l)?"disabled":"")+' onclick="buy(\''+u[0]+'\')">'+(l>=10?"Max":cost(l)+" 🪙")+"</button></div>"}).join("")+'<button onclick="menu()">Indietro</button>')}

function buy(k){const l=S.up[k];if(l<10&&S.coins>=cost(l)){S.coins-=cost(l);S.up[k]++;save();ups()}}

function skins(){panel("<h1>Skin</h1><p>🪙 "+S.coins+"</p>"+SK.map((s,i)=>'<div class=r><span style="color:#'+s[1].toString(16).padStart(6,"0")+'"><b>● '+s[0]+'</b></span><button '+(!S.own[i]&&S.coins<s[2]?"disabled":"")+' onclick="sk('+i+')">'+(S.skin===i?"In uso":S.own[i]?"Usa":s[2]+" 🪙")+"</button></div>").join("")+'<button onclick="menu()">Indietro</button>')}

function sk(i){if(S.own[i]){S.skin=i}else if(S.coins>=SK[i][2]){S.coins-=SK[i][2];S.own[i]=1;S.skin=i}else return;save();pm.material.color.setHex(SK[S.skin][1]);skins()}

const mv=e=>{if(st==="play")tx=Math.max(-4.6,Math.min(4.6,(e.clientX/innerWidth-.5)*9.2))};

addEventListener("pointermove",mv);addEventListener("pointerdown",mv);

addEventListener("keydown",e=>{if(st!=="play")return;if(e.key==="ArrowLeft"||e.key==="a")tx=Math.max(-4.6,tx-.8);if(e.key==="ArrowRight"||e.key==="d")tx=Math.min(4.6,tx+.8)});

const clk=new T.Clock(),cp=new T.Vector3(),lk=new T.Vector3(),hp3=new T.Vector3(),hl=new T.Vector3();

function tick(){

 requestAnimationFrame(tick);

 const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;

 if(st==="play")step(dt);

 const oldSX=sx;sx+=(tx-sx)*Math.min(1,dt*10);

 if(st==="play")for(const u of P)u.x=Math.max(-W/2,Math.min(W/2,u.x+(sx-oldSX)));

 let cx=0,cz=ZS;

 if(P.length){for(const u of P){cx+=u.x;cz+=u.z}cx/=P.length;cz/=P.length}

 hp3.set(cx*.35,11,cz+12);hl.set(cx*.25,0,cz-7)

 const k=1-Math.exp(-3*dt);cp.lerp(hp3,k);lk.lerp(hl,k);cam.position.copy(cp);cam.lookAt(lk);

 for(let i=0;i<PN;i++){const p=pd[i];

  if(p.l>0){p.l-=dt;p.vy-=14*dt;p.x+=p.vx*dt;p.y=Math.max(0,p.y+p.vy*dt);p.z+=p.vz*dt;pa[i*3]=p.x;pa[i*3+1]=p.y;pa[i*3+2]=p.z}else pa[i*3+1]=-99}

 pg.attributes.position.needsUpdate=true;

 draw(pm,P,t);draw(em,E,t);

 if(st!=="menu"&&tw){$("h1").textContent="🪙 "+(S.coins+Math.round(gain));$("h2").textContent="Lv "+n;$("hp").style.width=Math.max(0,tw.hp/tw.mx*100)+"%";$("h3").textContent="👥 "+P.length;$("h4").textContent="❤️ "+Math.max(0,base)}

 R.render(sc,cam)}

menu();tick();

</script>

</body>

</html>
